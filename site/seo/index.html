<!DOCTYPE html>
<html lang="zh-CN" class="chatgpt-theme" data-theme="light" data-appearance-preset="codex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SEO 学习 · 网站性能优化课程存档</title>
<link rel="stylesheet" href="assets/official.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开课程目录" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="brand-title" id="brandTitle">网站性能优化计划群</div>
      <div class="brand-meta" id="brandMeta"></div>
    </div>
    <div class="top-actions">
      <a class="pill-btn home-link" href="../">首页</a>
      <button class="pill-btn" id="searchBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
        <span>搜索</span>
      </button>
      <button class="pill-btn" id="allBtn" hidden>显示全部</button>
      <button class="icon-btn" id="themeBtn" aria-label="切换深浅主题" title="切换深浅主题">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/></svg>
      </button>
    </div>
  </header>

  <div class="body-row">
    <aside class="sidebar" id="sidebar" aria-label="课程目录">
      <div class="side-section">
        <div class="side-title">课程目录</div>
        <div id="lessonList" class="lesson-list"></div>
      </div>
      <div class="side-section side-info">
        <div class="side-title">图片说明</div>
        <p class="side-note">对话里的图片是按需搜索的，导出只保留了搜索词。占位卡上的 <code>img-NN</code> 是补图编号：把对应图片命名为 <code>img-NN.jpg</code> 放进 <code>assets/fill/</code>，刷新页面即自动回填。</p>
        <div class="side-title side-title-sub">浏览器缓存到的原图</div>
        <div id="cachedList" class="cached-list"></div>
      </div>
    </aside>

    <main class="thread-wrap" id="threadWrap">
      <div class="thread" id="thread"></div>
      <div class="thread-foot" id="threadFoot"></div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
</div>

<div class="search-panel" id="searchPanel" hidden>
  <div class="search-head">
    <input id="searchInput" type="search" placeholder="搜索课程内容、代码、关键词…" autocomplete="off" spellcheck="false">
    <button class="pill-btn" id="searchClose">关闭</button>
  </div>
  <div class="search-summary" id="searchSummary"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="sources-panel" id="sourcesPanel" hidden>
  <div class="sources-head"><span>参考来源</span><button class="pill-btn" id="sourcesClose">关闭</button></div>
  <div class="sources-list" id="sourcesList"></div>
</div>

<script src="data.js"></script>
<script src="assets/cached/cached.js"></script>
<script src="renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
